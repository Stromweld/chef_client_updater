---
# TAS50: THIS IS NOT A TYPICAL STANDARD DOKKEN KITCHEN FILE
driver:
  name: dokken
  privileged: true  # because Docker and SystemD/Upstart
  chef_version: 18.5.0

transport:
  name: dokken

provisioner:
  name: chef_infra
  product_name: chef
  product_version: '<%= ENV["CHEF_VERSION"] || "18.5.0" %>'

verifier:
  name: inspec

platforms:
  - name: almalinux-8
    driver:
      image: dokken/almalinux-8
      pid_one_command: /bin/systemd
  - name: almalinux-9
    driver:
      image: dokken/almalinux-9
      pid_one_command: /bin/systemd
  - name: almalinux-10
    driver:
      image: dokken/almalinux-10
      pid_one_command: /bin/systemd
  - name: ubuntu-22.04
    driver:
      image: dokken/ubuntu-22.04
      pid_one_command: /bin/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /bin/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
