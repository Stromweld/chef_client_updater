driver:
  name: vagrant

provisioner:
  name: chef_solo
  product_name: chef
  product_version: '<%= ENV["CHEF_VERSION"] || "12.13.37" %>'
  retry_on_exit_code:
    - 213
  max_retries: 1
  wait_for_retry: 1
  solo_rb:
    exit_status: :enabled
    client_fork: false
  log_level: :info

verifier:
  name: inspec

platforms:
  - name: almalinux-9
  - name: almalinux-10
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: freebsd-15
  - name: ubuntu-22.04
  - name: ubuntu-24.04
  - name: windows-2022
    driver:
      box: stromweld/windows-2022
      customize:
        memory: 4096
    provisioner:
      wait_for_retry: 300
    transport:
      name: winrm
      elevated: true
  - name: windows-2025
    driver:
      box: stromweld/windows-2025
      customize:
        memory: 4096
    provisioner:
      wait_for_retry: 300
    transport:
      name: winrm
      elevated: true
  - name: macos-26
    driver:
      box: stromweld/macos-26
      customize:
        memory: 4096

suites:
  - name: default
    run_list:
      - recipe[test::default]
    excludes:
      - windows-2022
      - windows-2025
  - name: license
    run_list:
      - recipe[test::license]
    # Test the upgrade from 14 -> 15 where the license is accepted even if all other tests upgrade
    # their original version to 15
    provisioner:
      product_version: '14'
  - name: license_id
    run_list:
      - recipe[test::license_id]
    attributes:
      chef_client_updater:
        license_id: 'free-79df705d-b685-419a-8b68-88401f74ff72-3999'
  - name: kill
    run_list:
      - recipe[test::kill]
    verifier:
      inspec_tests:
        - path: ./test/integration/default/
  - name: no_service_restart
    run_list:
      - recipe[test::no_service_restart]
    verifier:
      inspec_tests:
        - path: ./test/integration/default/
  - name: direct_url
    run_list:
      - recipe[test::direct_url]
    includes: almalinux-9
  - name: constrained
    run_list:
      - recipe[test::constrained]
    includes: almalinux-9
  - name: noop
    run_list:
      - recipe[test::noop]
    includes: almalinux-9
  - name: rubygems-url
    run_list:
      - recipe[test::gem_server]
      - recipe[test::rubygems_url]
    includes: ubuntu-24.04
    provisioner:
      product_version: 12.13.37
    verifier:
      inspec_tests:
        - path: ./test/integration/default/
